spring:
  application:
    name: api-service

  config:
    import: optional:classpath:application-local.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8081
  servlet:
    context-path: /api-management
