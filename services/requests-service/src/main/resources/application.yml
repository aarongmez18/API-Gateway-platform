spring:
  config:
    import: optional:classpath:application-local.properties

  application:
    name: requests-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/api-gateway-platform

server:
  port: 8085
  servlet:
    context-path: /requests-management