<header class="topbar">
  <div>
    <span class="environment">PANEL</span>
    <span class="separator">/</span>
    <span class="date">{{ today }}</span>
  </div>

  <div class="profile">
    <span class="connection">● Gateway online</span>
    <span>{{ auth.username }}</span>
    <span class="badge">{{ auth.isAdmin() ? 'ADMIN' : 'USER' }}</span>
    <button class="btn btn-ghost" type="button" (click)="logout()">Cerrar sesión</button>
  </div>
</header>
