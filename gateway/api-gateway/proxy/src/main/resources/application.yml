spring:
  application:
    name: proxy

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/api-gateway-platform

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Administración: NO API Key
            - id: api-management
              uri: http://localhost:8081
              predicates:
                - Path=/api-management/**

            # Administración: NO API Key
            - id: users-management
              uri: http://localhost:8082
              predicates:
                - Path=/users-management/**

            # API externa: SÍ API Key
            - id: protected-api-management
              uri: http://localhost:8084
              predicates:
                - Path=/api-protected-management/**
              filters:
                - name: RequestLogging
                  args:
                    apiCode: apis-management
                - ApiKeyAuthentication
                - name: ApiPermission
                  args:
                    apiCode: apis-management
                - RateLimit

            # Administración: NO API Key
            - id: model-management
              uri: http://localhost:8083
              predicates:
                - Path=/model-management/api/model/**


            - id: requests-management
              uri: http://localhost:8085
              predicates:
                - Path=/requests-management/request-logs,/requests-management/request-logs/**

server:
  port: 9000